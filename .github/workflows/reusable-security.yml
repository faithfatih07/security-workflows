name: Reusable Security Scans

on:
  workflow_call:

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  semgrep:
    name: Semgrep code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Scan with Semgrep
        run: semgrep scan --config p/security-audit --metrics=off --sarif --output semgrep.sarif .

      - name: Upload Semgrep results
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  detect-codeql-languages:
    name: Detect CodeQL-supported languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Detect languages in calling repository
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.listLanguages({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const map = {
              "C": "c-cpp",
              "C++": "c-cpp",
              "Objective-C": "c-cpp",
              "Objective-C++": "c-cpp",
              "C#": "csharp",
              "Go": "go",
              "Java": "java-kotlin",
              "Kotlin": "java-kotlin",
              "JavaScript": "javascript-typescript",
              "TypeScript": "javascript-typescript",
              "Python": "python",
              "Ruby": "ruby",
              "Rust": "rust",
              "Swift": "swift"
            };

            const languages = [...new Set(
              Object.keys(response.data).map(name => map[name]).filter(Boolean)
            )];

            const matrix = languages.map(language => ({
              language,
              "build-mode": ["javascript-typescript", "python", "ruby"].includes(language)
                ? "none"
                : "autobuild"
            }));

            core.info(matrix.length
              ? `CodeQL will analyze: ${languages.join(", ")}`
              : "No CodeQL-supported source language detected; CodeQL will be skipped.");

            core.setOutput("matrix", JSON.stringify(matrix));

  codeql:
    name: CodeQL analysis
    needs: detect-codeql-languages
    if: needs.detect-codeql-languages.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-codeql-languages.outputs.matrix) }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
  security-gate:
    name: Security gate
    needs: [trivy, semgrep, detect-codeql-languages, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all applicable scanners completed
        env:
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          LANGUAGE_DETECTION_RESULT: ${{ needs.detect-codeql-languages.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          echo "Trivy: ${TRIVY_RESULT}"
          echo "Semgrep: ${SEMGREP_RESULT}"
          echo "CodeQL language detection: ${LANGUAGE_DETECTION_RESULT}"
          echo "CodeQL: ${CODEQL_RESULT}"

          test "${TRIVY_RESULT}" = "success"
          test "${SEMGREP_RESULT}" = "success"
          test "${LANGUAGE_DETECTION_RESULT}" = "success"
          test "${CODEQL_RESULT}" = "success" || test "${CODEQL_RESULT}" = "skipped"
