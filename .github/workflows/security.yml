name: Reusable Security Scans

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the Semgrep job
        required: false
        type: string
        default: "3.12"
      trivy-scan-ref:
        description: Directory or file path scanned by Trivy
        required: false
        type: string
        default: "."
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.trivy-scan-ref }}
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  semgrep:
    name: Semgrep code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Scan with Semgrep
        run: semgrep scan --config p/security-audit --metrics=off --sarif --output semgrep.sarif .

      - name: Upload Semgrep results
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
